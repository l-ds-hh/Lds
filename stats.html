<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>统计 · 简账</title>
<script src="theme.js"></script>
<script src="accent.js"></script>
<meta name="theme-color" content="#4C6FFF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="简账">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png"><link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="lock.css">
<link rel="stylesheet" href="calendar.css">
<link rel="stylesheet" href="extra.css">
<style>
  .monthbar{display:flex;align-items:center;justify-content:center;gap:14px;padding:10px 0 14px}
  .monthbar button{border:0;background:#fff;width:30px;height:30px;border-radius:10px;
    font-size:15px;color:var(--text-2);cursor:pointer}
  .monthbar .m{font-size:15px;font-weight:650;min-width:96px;text-align:center}
  .seg{display:flex;background:#EDEFF3;border-radius:11px;padding:3px;margin-bottom:14px}
  .seg button{flex:1;border:0;background:transparent;padding:8px;border-radius:9px;
    font-size:13.5px;color:var(--text-2);font-family:inherit;cursor:pointer;font-weight:500}
  .seg button.on{background:#fff;color:var(--text);font-weight:600;
    box-shadow:0 1px 3px rgba(16,24,40,.1)}
  .legend .dot{width:8px;height:8px;border-radius:3px;flex-shrink:0}
</style>
<style>
  /* 统计页：压缩到一屏放完 */
  .content{padding-top:0;padding-bottom:calc(var(--nav-h) + 6px)}
  .monthbar{padding:0 0 8px}
  .section{margin-top:12px}
  .sum-row .sum-box{padding:10px 6px;border-radius:13px}
  .sum-row .sum-box .k{font-size:11.5px}
  .sum-row .sum-box .v{font-size:17px;margin-top:2px}
  .seg{margin-bottom:10px}
  .card{padding:12px}
  .donut{width:104px;height:104px}
  .donut::after{inset:14px}
  .donut-wrap{gap:12px;padding:0}
  .donut .center .n{font-size:15px}
  .donut .center .t{font-size:10px}
  .legend{gap:6px}
  .legend .li{font-size:12px}
  .diff-line{margin-top:10px;padding-top:9px;font-size:12px}
  .section-head{margin-bottom:6px}
  .bars{gap:7px}
  .bar-row .top{font-size:12px;margin-bottom:3px}
  .track{height:6px}</style></head>
<body>
<div class="app">
  <div class="hero"></div>

  <header class="topbar">
    <div class="title">统计</div>
  </header>

  <main class="content">

    <div class="monthbar">
      <button onclick="shiftMonth(-1)">‹</button>
      <button class="month-label-btn" onclick="pickMonth()">
        <span id="monthLabel">—</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <button onclick="shiftMonth(1)">›</button>
    </div>

    <div class="sum-row">
      <div class="sum-box in"><div class="k">收入</div><div class="v" id="sumIn">0</div></div>
      <div class="sum-box out"><div class="k">支出</div><div class="v" id="sumOut">0</div></div>
      <div class="sum-box"><div class="k">结余</div><div class="v" id="sumBal">0</div></div>
    </div>

    <div class="section">
      <div class="seg">
        <button class="on" onclick="setType('expense',this)">支出构成</button>
        <button onclick="setType('income',this)">收入构成</button>
      </div>

      <div class="card">
        <div class="donut-wrap">
          <div class="donut" id="donut">
            <div class="center">
              <div class="t" id="donutLabel">总支出</div>
              <div class="n" id="donutValue">0</div>
            </div>
          </div>
          <div class="legend" id="legend"></div>
        </div>
        <div class="diff-line" id="diffLine"></div>
      </div>
    </div>

    <div class="section">
      <div class="section-head"><h2 id="rankTitle">分类排行</h2></div>
      <div class="card"><div class="bars" id="bars"></div></div>
    </div>

    </main>

  <nav class="tabbar">
    <a class="tab" href="index.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 5v14M5 12h14"/></svg>记账
    </a>
    <a class="tab" href="records.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>账单
    </a>
    <div class="tab fab-slot" id="fabSlot"></div>
    <a class="tab active" href="stats.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 20V10M12 20V4M6 20v-6"/></svg>统计
    </a>
    <a class="tab" href="mine.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>我的
    </a>
  </nav>

</div>

<script src="pwa.js"></script>
  <script src="store.js"></script>
<script src="icons.js"></script>
<script src="feedback.js"></script>
<script src="quick.js"></script>
<script src="calendar.js"></script>
<script src="lock.js"></script>
<script>
var curMonth = Store.thisMonth();
var curType = "expense";
var COLORS = ["#4C6FFF", "#FF9F43", "#EE5D8C", "#7C6CF5", "#22B8CF", "#0FA958", "#C9CED8"];

function shiftMonth(d){
  var p = curMonth.split("-");
  var dd = new Date(+p[0], +p[1] - 1 + d, 1);
  curMonth = dd.getFullYear() + "-" + String(dd.getMonth() + 1).padStart(2, "0");
  render();
}
function pickMonth(){
  CalendarPicker.open({
    mode: "month",
    value: curMonth + "-01",
    onPick: function(v){ curMonth = v.slice(0, 7); render(); }
  });
}
function setType(t, el){
  curType = t;
  document.querySelectorAll(".seg button").forEach(function(b){ b.classList.remove("on"); });
  if(el) el.classList.add("on");
  else document.querySelectorAll(".seg button")[t === "expense" ? 0 : 1].classList.add("on");
  render();
}

function render(){
  document.getElementById("monthLabel").textContent = curMonth.split("-")[0] + "年" + parseInt(curMonth.slice(5,7),10) + "月";

  var s = Store.summary(curMonth);
  document.getElementById("sumIn").textContent = Math.round(s.income).toLocaleString("zh-CN");
  document.getElementById("sumOut").textContent = Math.round(s.expense).toLocaleString("zh-CN");
  document.getElementById("sumBal").textContent = Math.round(s.balance).toLocaleString("zh-CN");

  var cats = Store.byCategory(curMonth, curType);
  var total = cats.reduce(function(a, c){ return a + c.amount; }, 0);

  document.getElementById("donutLabel").textContent = curType === "expense" ? "总支出" : "总收入";
  document.getElementById("donutValue").textContent = Math.round(total).toLocaleString("zh-CN");
  document.getElementById("rankTitle").textContent = (curType === "expense" ? "支出" : "收入") + "排行";

  /* 环形图 */
  var donut = document.getElementById("donut");
  if(!total){
    donut.style.background = "#EDEFF3";
    document.getElementById("legend").innerHTML = '<div class="s-sub">本月没有数据</div>';
    document.getElementById("bars").innerHTML = '<div class="s-sub">本月没有数据</div>';
  } else {
    var stops = [], acc = 0;
    cats.forEach(function(c, i){
      var p = c.amount / total * 100;
      var color = COLORS[i % COLORS.length];
      stops.push(color + " " + acc.toFixed(2) + "% " + (acc + p).toFixed(2) + "%");
      acc += p;
    });
    donut.style.background = "conic-gradient(" + stops.join(",") + ")";

    document.getElementById("legend").innerHTML = cats.slice(0, 6).map(function(c, i){
      var p = Math.round(c.amount / total * 100);
      return '<div class="li"><span class="dot" style="background:' + COLORS[i % COLORS.length] + '"></span>' +
             '<span class="nm">' + c.name + '</span><span class="pc">' + p + '%</span></div>';
    }).join("");

    var max = cats[0].amount;
    document.getElementById("bars").innerHTML = cats.map(function(c, i){
      var w = max ? (c.amount / max * 100) : 0;
      return '<div class="bar-row">' +
        '<div class="top"><b>' + c.name + '</b><span>¥' + Store.fmt(c.amount) + '</span></div>' +
        '<div class="track"><i style="width:' + w + '%;background:' + COLORS[i % COLORS.length] + '"></i></div>' +
      '</div>';
    }).join("");
  }

  /* 环比（合并到环形图卡片底部一行） */
  var p2 = curMonth.split("-");
  var prevDate = new Date(+p2[0], +p2[1] - 2, 1);
  var prevMonth = prevDate.getFullYear() + "-" + String(prevDate.getMonth() + 1).padStart(2, "0");
  var prev = Store.summary(prevMonth);
  var diff = s.expense - prev.expense;
  var line = document.getElementById("diffLine");

  if(!prev.expense && !s.expense){
    line.textContent = "";
  } else if(diff > 0){
    var pc = prev.expense ? Math.round(diff / prev.expense * 100) : 100;
    line.innerHTML = '较上月 <b style="color:var(--expense)">增加 ¥' + Store.fmt(diff) + '</b>（+' + pc + '%）';
  } else if(diff < 0){
    var pc2 = Math.round(-diff / (prev.expense || 1) * 100);
    line.innerHTML = '较上月 <b style="color:var(--income)">减少 ¥' + Store.fmt(-diff) + '</b>（−' + pc2 + '%）';
  } else {
    line.textContent = "与上月持平";
  }
}

render();
</script>
</body>
</html>
